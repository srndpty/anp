[project]
name = "anp"
version = "0.0.0"
description = "学習向けPDFリーダー（annotator for pdf）"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
anp = "anp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anp"]
