[project]
name = "anp"
version = "0.0.0"
description = "学習向けPDFリーダー（annotator for pdf）"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
anp = "anp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anp"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.9",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # pathlib を使う
    "ARG",  # 未使用引数
    "TID",  # 相対importの制限
    "T20",  # print の禁止（ログを使う）
    "ANN",  # 型注釈の強制
    "RUF",
]
ignore = [
    "ANN401", # *args/**kwargs の Any は許容する
    # コメントと docstring は日本語で書くため、全角記号を誤りとしない。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# テストでは print と未使用引数（fixture）を許容する
"tests/*" = ["T20", "ARG001", "ANN201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
qt_api = "pyside6"

[tool.coverage.run]
source = ["anp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
